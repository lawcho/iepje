# GitHub script for 'continuous deployment',
# i.e. automatically re-building & publishing the website
# when sources change in the master branch

name: Deploy examples gallery

on:
  push:
    branches: ["master"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Cache builds (including of Agda) in a generic nix cache
      - uses: cachix/install-nix-action@v25
      - uses: cachix/cachix-action@v14
        with:
          name: lawcho
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          # Relies on a cachix auth token (expiring sep 2027)
          # that was manually generated at
          # https://app.cachix.org/cache/lawcho/settings/authtokens
          # and manually installed in
          # https://github.com/lawcho/iepje/settings/secrets/actions
      - run: nix build --out-link _site
      - uses: actions/upload-pages-artifact@v3
  # GitHub recommends putting deploy in a dedicated job
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

# Implementaton adapted from
# https://github.com/compiling-to-categories/concat/blob/7aa7d5ebe165161b7c0aafb8af006020534eaf70/.github/workflows/pages.yml
# https://nix.dev/guides/recipes/continuous-integration-github-actions#setting-up-github-actions
